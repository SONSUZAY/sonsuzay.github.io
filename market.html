<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONSUZ.AY | Google Play Market</title>

    <link rel="icon" type="image/png" href="site_simge.png">

    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* YILDIZ EFEKTLERİ */
        .stars { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle 3s infinite ease-in-out; }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 5px white; }
            100% { opacity: 0.2; transform: scale(0.8); }
        }

        h1 {
            color: #39FF14;
            text-shadow: 0 0 15px #39FF14;
            font-size: 2.5rem; margin-bottom: 5px; position: relative; z-index: 2;
        }

        p.subtitle {
            color: #aaa; font-size: 1rem; margin-bottom: 40px; position: relative; z-index: 2; max-width: 600px;
        }

        .apps-container {
            display: flex; flex-direction: column; align-items: center;
            gap: 25px; width: 100%; max-width: 500px; position: relative; z-index: 2;
        }

        .app-card {
            background: rgba(20, 30, 40, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(57, 255, 20, 0.2);
            border-radius: 24px;
            padding: 25px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            text-align: left;
        }

        .app-card:hover {
            transform: scale(1.03);
            border-color: #39FF14;
            box-shadow: 0 15px 45px rgba(57, 255, 20, 0.2);
        }

        .app-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: white;
            margin-right: 20px;
            flex-shrink: 0;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.3);
        }

        .app-info { flex: 1; }
        .app-title { font-size: 1.3rem; color: #fff; font-weight: bold; margin-bottom: 5px; }
        .app-desc { color: #bbb; font-size: 0.9rem; line-height: 1.4; margin-bottom: 15px; }

        .play-store-btn {
            display: inline-flex;
            align-items: center;
            padding: 10px 20px;
            background-color: #39FF14;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 50px;
            transition: 0.3s;
            box-shadow: 0 5px 15px rgba(57, 255, 20, 0.3);
        }

        .play-store-btn:hover {
            background-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.4);
        }

        .back-link {
            margin-top: 50px;
            color: #39FF14;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #39FF14;
            padding: 10px 25px;
            border-radius: 50px;
            transition: 0.3s;
        }

        .back-link:hover {
            background: #39FF14;
            color: #000;
        }

        @media (max-width: 480px) {
            .app-card { flex-direction: column; text-align: center; }
            .app-icon { margin-right: 0; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <div class="stars" id="starContainer"></div>

    <h1>GOOGLE PLAY MARKET</h1>
    <p class="subtitle">
        Resmi SONSUZ.AY uygulamalarını güvenle doğrudan Google Play Store üzerinden indirebilirsiniz.
    </p>

    <div class="apps-container">

        <!-- EMNİYET KEMERİ UYGULAMASI -->
        <div class="app-card">
            <div class="app-icon">🛡️</div>
            <div class="app-info">
                <div class="app-title">EMNİYET KEMERİ</div>
                <div class="app-desc">
                    Akıllı hatırlatıcı sistemi ile güvenli sürüş deneyimi. Artık Google Play Store'da!
                </div>
                <a href="https://play.google.com/store/apps/details?id=com.sonsuzay.emniyetkemeri" target="_blank" class="play-store-btn">
                    Google Play'den İndir
                </a>
            </div>
        </div>

    </div>

    <a href="index.html" class="back-link">⬅ Ana Sayfaya Dön</a>

    <script>
        const container = document.getElementById('starContainer');
        for(let i=0; i<50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const x = Math.random() * 100;
            const y = Math.random() * 100;
            const size = Math.random() * 2 + 1;
            const duration = 2 + Math.random() * 3;
            container.appendChild(star);
            star.style.left = x + '%'; star.style.top = y + '%';
            star.style.width = size + 'px'; star.style.height = size + 'px';
            star.style.animationDuration = duration + 's';
        }
    </script>
</body>
</html>

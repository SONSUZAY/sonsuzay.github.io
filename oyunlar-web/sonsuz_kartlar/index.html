<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONSUZ.AY - Sonsuz Kartlar</title>
    <meta name="mobile-web-app-capable" content="yes">
    <style>
        body {
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: url('gorseller/arkaplan.jpeg'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            overflow: hidden; user-select: none;
        }

        /* ANA MENÜ VE KAZANMA EKRANI ORTAK STİL */
        .overlay-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75)), url('gorseller/kazandin.jpg');
            background-size: cover; background-position: center;
            z-index: 100; display: flex; flex-direction: column;
            justify-content: center; align-items: center; text-align: center; color: white;
        }

        #main-menu { display: flex; } /* İlk açılışta görünür */
        #win-screen { display: none; } /* Oyun bitince görünür */

        h1 { font-size: 3.5rem; margin-bottom: 30px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); letter-spacing: 2px; }

        .btn {
            padding: 15px 50px; font-size: 1.3rem; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s; margin: 10px; font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .start-btn { background-color: #3498db; color: white; }
        .restart-btn { background-color: #2ecc71; color: white; }
        .menu-btn { background-color: #e67e22; color: white; }
        .btn:active { transform: scale(0.9); }

        /* OYUN ALANI */
        .stats-container {
            display: none; /* Menüdeyken gizli */
            gap: 20px; margin-bottom: 15px; background: rgba(0, 0, 0, 0.7);
            padding: 10px 25px; border-radius: 30px; color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 10;
        }

        .game-container {
            display: none; /* Menüdeyken gizli */
            grid-template-columns: repeat(4, 80px); grid-template-rows: repeat(5, 110px);
            grid-gap: 10px; perspective: 1000px;
        }

        @media (min-width: 600px) {
            .game-container { grid-template-columns: repeat(4, 100px); grid-template-rows: repeat(5, 140px); grid-gap: 15px; }
        }

        .memory-card { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.4s; cursor: pointer; }
        .memory-card.flip { transform: rotateY(180deg); }
        .front-face, .back-face { width: 100%; height: 100%; position: absolute; border-radius: 12px; backface-visibility: hidden; object-fit: cover; }
        .front-face { transform: rotateY(180deg); background-color: #fff; }
        .back-face { background-color: #2c3e50; content: url('gorseller/kart_arka.jpeg'); }

        .confetti { position: absolute; width: 8px; height: 8px; top: -10px; z-index: 101; animation: fall linear forwards; }
        @keyframes fall { to { transform: translateY(100vh) rotate(720deg); } }
    </style>
</head>
<body>

    <audio id="bgMusic" src="sesler/arkaplan.ogg" loop></audio>
    <audio id="cardSound" src="sesler/kart_sesi.wav"></audio>
    <audio id="winSound" src="sesler/kazanma_sesi.wav"></audio>

    <div id="main-menu" class="overlay-screen">
        <h1>SONSUZ KARTLAR</h1>
        <button class="btn start-btn" onclick="startGame()">BAŞLA ▶️</button>
    </div>

    <div class="stats-container" id="statsPanel">
        <div>Hamle: <span id="moves">0</span></div>
        <div>Süre: <span id="timer">0</span> sn</div>
    </div>
    <div class="game-container" id="gameBoard"></div>

    <div id="win-screen" class="overlay-screen">
        <h1>TEBRİKLER! 🎉</h1>
        <p id="final-stats" style="font-size: 1.2rem; margin-bottom: 20px;"></p>
        <button class="btn restart-btn" onclick="restartGame()">Tekrar Oyna 🔄</button>
        <button class="btn menu-btn" onclick="goToMenu()">Menü 🏠</button>
    </div>

    <script>
        const cardsArray = [
            { name: 'g1', img: 'gorseller/kart_1.jpg' }, { name: 'g1', img: 'gorseller/kart_1.jpg' },
            { name: 'g2', img: 'gorseller/kart_2.jpg' }, { name: 'g2', img: 'gorseller/kart_2.jpg' },
            { name: 'g3', img: 'gorseller/kart_3.jpg' }, { name: 'g3', img: 'gorseller/kart_3.jpg' },
            { name: 'g4', img: 'gorseller/kart_4.jpg' }, { name: 'g4', img: 'gorseller/kart_4.jpg' },
            { name: 'g5', img: 'gorseller/kart_5.jpg' }, { name: 'g5', img: 'gorseller/kart_5.jpg' },
            { name: 'g6', img: 'gorseller/kart_6.jpg' }, { name: 'g6', img: 'gorseller/kart_6.jpg' },
            { name: 'g7', img: 'gorseller/kart_7.jpg' }, { name: 'g7', img: 'gorseller/kart_7.jpg' },
            { name: 'g8', img: 'gorseller/kart_8.jpg' }, { name: 'g8', img: 'gorseller/kart_8.jpg' },
            { name: 'g9', img: 'gorseller/kart_9.jpg' }, { name: 'g9', img: 'gorseller/kart_9.jpg' },
            { name: 'g10', img: 'gorseller/kart_10.jpg' }, { name: 'g10', img: 'gorseller/kart_10.jpg' }
        ];

        let hasFlippedCard = false, lockBoard = false;
        let firstCard, secondCard;
        let matchedPairs = 0, moves = 0, seconds = 0;
        let timerInterval;

        const bgMusic = document.getElementById('bgMusic');
        const cardSound = document.getElementById('cardSound');
        const winSound = document.getElementById('winSound');

        // GÖRÜNÜRLÜK KONTROLÜ
        document.addEventListener("visibilitychange", () => {
            if (document.hidden) bgMusic.pause();
            else if (document.getElementById('main-menu').style.display === 'none' && matchedPairs < 10) bgMusic.play();
        });

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('statsPanel').style.display = 'flex';
            document.getElementById('gameBoard').style.display = 'grid';
            bgMusic.play().catch(e => console.log(e));
            startTimer();
            createBoard();
        }

        function startTimer() {
            seconds = 0;
            document.getElementById('timer').innerText = seconds;
            timerInterval = setInterval(() => {
                seconds++;
                document.getElementById('timer').innerText = seconds;
            }, 1000);
        }

        function createBoard() {
            const gameBoard = document.getElementById('gameBoard');
            gameBoard.innerHTML = '';
            cardsArray.sort(() => 0.5 - Math.random());
            cardsArray.forEach(item => {
                const card = document.createElement('div');
                card.classList.add('memory-card');
                card.dataset.name = item.name;
                card.innerHTML = `<img class="front-face" src="${item.img}"><div class="back-face"></div>`;
                card.addEventListener('click', flipCard);
                gameBoard.appendChild(card);
            });
        }

        function flipCard() {
            if (lockBoard || this === firstCard) return;
            cardSound.currentTime = 0;
            cardSound.play();
            this.classList.add('flip');
            if (!hasFlippedCard) {
                hasFlippedCard = true;
                firstCard = this;
                return;
            }
            secondCard = this;
            moves++;
            document.getElementById('moves').innerText = moves;
            checkForMatch();
        }

        function checkForMatch() {
            if (firstCard.dataset.name === secondCard.dataset.name) {
                matchedPairs++;
                firstCard.removeEventListener('click', flipCard);
                secondCard.removeEventListener('click', flipCard);
                resetBoard();
                if (matchedPairs === 10) {
                    clearInterval(timerInterval);
                    setTimeout(showWinScreen, 500);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    firstCard.classList.remove('flip');
                    secondCard.classList.remove('flip');
                    resetBoard();
                }, 1000);
            }
        }

        function resetBoard() {
            [hasFlippedCard, lockBoard] = [false, false];
            [firstCard, secondCard] = [null, null];
        }

        function showWinScreen() {
            bgMusic.pause();
            winSound.play();
            document.getElementById('final-stats').innerText = `${seconds} saniyede ve ${moves} hamlede tamamladın!`;
            document.getElementById('win-screen').style.display = 'flex';
            startConfetti();
        }

        function restartGame() {
            matchedPairs = 0; moves = 0;
            document.getElementById('moves').innerText = "0";
            document.getElementById('win-screen').style.display = 'none';
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            clearInterval(timerInterval);
            startTimer();
            createBoard();
            bgMusic.currentTime = 0;
            bgMusic.play();
        }

        function goToMenu() {
            matchedPairs = 0; moves = 0; seconds = 0;
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('win-screen').style.display = 'none';
            document.getElementById('statsPanel').style.display = 'none';
            document.getElementById('gameBoard').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
            document.querySelectorAll('.confetti').forEach(c => c.remove());
            bgMusic.pause();
            bgMusic.currentTime = 0;
        }

        function startConfetti() {
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
                document.body.appendChild(confetti);
            }
        }
    </script>
</body>
</html>
